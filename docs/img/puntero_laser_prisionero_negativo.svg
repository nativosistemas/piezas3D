<rect x="208" y="300" width="24" height="14" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.5"/>
<path fill-rule="evenodd" fill="#B4B2A9" d="M150 220a70 70 0 1 0 140 0a70 70 0 1 0 -140 0ZM160 220a60 60 0 1 0 120 0a60 60 0 1 0 -120 0Z"/>
<circle cx="220" cy="220" r="70" fill="none" stroke="#2C2C2A" stroke-width="3"/>

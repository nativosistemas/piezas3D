<g transform="translate(220 220) rotate(-45)"><rect x="-6" y="-85" width="12" height="16" fill="#2C2C2A"/></g>
<rect x="216" y="92" width="8" height="57" fill="#888780" stroke="#444441" stroke-width="0.5"/>
<polygon points="216,149 224,149 220,156" fill="#888780" stroke="#444441" stroke-width="0.5"/>
<rect x="203" y="120" width="34" height="5" rx="2" fill="#BA7517"/>
<rect x="209" y="109" width="22" height="11" fill="#5F5E5A"/>
<path d="M203 122Q176 122 169 95L166 58" fill="none" stroke="#2C2C2A" stroke-width="4" stroke-linecap="round"/>
<rect x="216" y="291" width="8" height="57" fill="#888780" stroke="#444441" stroke-width="0.5"/>
<polygon points="216,291 224,291 220,284" fill="#888780" stroke="#444441" stroke-width="0.5"/>
<rect x="209" y="314" width="22" height="11" fill="#5F5E5A"/>
<text x="220" y="224" text-anchor="middle">pila falsa</text>
<text x="166" y="44" text-anchor="middle">al regulador (OUT−)</text>
<line class="leader" x1="130" y1="158" x2="156" y2="159"/>
<text x="40" y="152">Ventana del</text>
<text x="40" y="168">hilo rojo (+)</text>
<line class="leader" x1="224" y1="96" x2="424" y2="76"/><circle class="punto" cx="224" cy="96" r="2"/>
<text class="th" x="430" y="80">Prisionero del negativo</text>
<line class="leader" x1="231" y1="114" x2="424" y2="106"/><circle class="punto" cx="231" cy="114" r="2"/>
<text x="430" y="110">Tuerca M3: aprieta el ojal</text>
<line class="leader" x1="237" y1="123" x2="424" y2="136"/><circle class="punto" cx="237" cy="123" r="2"/>
<text x="430" y="140">Ojal del hilo negro</text>

<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" role="img">
<title>Corte de la tapa trasera del láser: prisionero del negativo</title>
<desc>Corte transversal del tubo del láser con la tapa trasera impresa. Arriba, el prisionero del negativo atraviesa la tapa y su punta cónica muerde un punto limado del tubo; sobre la tapa lleva el ojal del hilo negro apretado con una tuerca. Abajo, el prisionero opuesto con contratuerca. A 45°, la ventana del hilo rojo.</desc>
<style>
text { font-family: system-ui, "Segoe UI", sans-serif; font-size: 12px; fill: #3d3d3a; }
text.th { font-size: 14px; font-weight: 500; fill: #1f1e1d; }
line.leader { stroke: #73726c; stroke-width: 0.5; stroke-dasharray: 3 3; }
circle.punto { fill: #73726c; }
</style>
<rect width="680" height="380" fill="#ffffff"/>
<path fill-rule="evenodd" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.5" d="M136 220a84 84 0 1 0 168 0a84 84 0 1 0 -168 0ZM150 220a70 70 0 1 0 140 0a70 70 0 1 0 -140 0Z"/>
